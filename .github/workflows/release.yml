name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0). If empty, builds without publishing.'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          go version

      - name: Build app and DMG
        run: ./scripts/package.sh

      - name: Resolve tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve version
        id: ver
        run: |
          v=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          echo "value=$v" >> "$GITHUB_OUTPUT"

      # Cross-build the portable CLI for the agentbox VM target. The
      # Go module is CGO-free so we can cross-compile straight from
      # the macOS runner without a Linux sysroot.
      - name: Cross-build linux-arm64 CLI
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags '-s -w' \
            -o "dist/notchify-${{ steps.ver.outputs.value }}-linux-arm64" \
            ./cmd/notchify
          file "dist/notchify-${{ steps.ver.outputs.value }}-linux-arm64"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: notchify-release
          path: |
            dist/Notchify-*.dmg
            dist/notchify-*-linux-arm64
          if-no-files-found: error

      - name: Publish GitHub release
        if: steps.tag.outputs.name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          draft: true
          generate_release_notes: true
          files: |
            dist/Notchify-*.dmg
            dist/notchify-*-linux-arm64
